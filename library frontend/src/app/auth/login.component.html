<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <i class="bi bi-book-half"></i>
      </div>
      <h1 class="login-title">LibraryMS</h1>
      <p class="login-subtitle">Library Management System</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <div class="input-wrapper">
          <i class="bi bi-person input-icon"></i>
          <input type="text" id="username" class="form-input"
                 formControlName="username" placeholder="Enter your username"
                 autocomplete="username" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="input-wrapper">
          <i class="bi bi-lock input-icon"></i>
          <input type="password" id="password" class="form-input"
                 formControlName="password" placeholder="Enter your password"
                 autocomplete="current-password" required>
        </div>
      </div>

      <div *ngIf="errorMessage" class="error-banner">
        <i class="bi bi-exclamation-circle"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <button type="submit" class="login-btn" [disabled]="loginForm.invalid || loading">
        <span *ngIf="!loading" class="btn-content">
          <span>Sign In</span>
          <i class="bi bi-arrow-right"></i>
        </span>
        <span *ngIf="loading" class="btn-loading">
          <span class="loading-spinner"></span>
          <span>Authenticating...</span>
        </span>
      </button>
    </form>
    <div class="login-footer">
      <p> </p>
    </div>
  </div>
</div>
